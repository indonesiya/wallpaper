# Welcome to Jekyll!
# 
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Wallpaper
email: admin@indonesiya.com
description: >
  A collection of high-quality HD, Full HD, and 4K wallpapers featuring nature landscapes, mountains, forests, beaches, sunsets, city views, and aesthetic designs.

url: "https://indonesiya.com"
baseurl: "/wallpaper"

timezone: Asia/Jakarta

future: false
default-image: /wallpaper/logo.jpg

built-by: Indonesiya

copyright:
  name: Wallpaper
  link: "https://indonesiya.com"

markdown: kramdown
permalink: /:title/

paginate: 6
paginate_path: /page:num/

sass:
  style: compressed

include:
  - _pages
  
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap